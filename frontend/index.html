<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Smart Attendance System | University Campus Management</title>
    <!-- Modern Typography: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Material Symbols Outlined for Clean Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Deep Navy & Institutional Blue Palette
              "primary": "#123B73",
              "primary-dark": "#0B2448",
              "primary-light": "#EAF3FF",
              "primary-container": "#0B2448",
              "on-primary": "#FFFFFF",
              "on-primary-container": "#EAF3FF",

              // Royal / Soft Blue
              "secondary": "#2563EB",
              "secondary-dark": "#1D4ED8",
              "secondary-light": "#EFF6FF",
              "secondary-container": "#EFF6FF",
              "on-secondary": "#FFFFFF",
              "on-secondary-container": "#1D4ED8",

              // Semantic Accents
              "success": "#16A34A",
              "success-light": "#EAF8EF",
              "error": "#DC2626",
              "danger": "#DC2626",
              "danger-light": "#FDECEC",
              "error-container": "#FDECEC",
              "warning": "#F59E0B",
              "warning-light": "#FFF7E6",
              "purple": "#7C3AED",
              "purple-light": "#F2EDFF",
              "info": "#0284C7",

              // Background & Layered Surfaces
              "background": "#F7F9FC",
              "on-background": "#0F172A",
              "surface": "#FFFFFF",
              "surface-bright": "#FFFFFF",
              "surface-warm": "#F8FAFC",
              "surface-container": "#F1F5F9",
              "surface-container-low": "#F8FAFC",
              "surface-container-high": "#E2E8F0",
              "surface-container-highest": "#CBD5E1",
              "surface-container-lowest": "#FFFFFF",
              "on-surface": "#0F172A",
              "on-surface-variant": "#475569",

              // Text & Borders
              "text-main": "#0F172A",
              "text-stone": "#64748B",
              "text-muted": "#94A3B8",
              "border-default": "#E2E8F0",
              "border-subtle": "#F1F5F9",
              "outline": "#CBD5E1",
              "outline-variant": "#E2E8F0",
            },
            borderRadius: {
              "sm": "0.375rem",
              "DEFAULT": "0.5rem",
              "md": "0.625rem",
              "lg": "0.75rem",
              "xl": "1rem",
              "2xl": "1.25rem",
              "3xl": "1.5rem",
              "full": "9999px"
            },
            boxShadow: {
              "card": "0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04)",
              "card-hover": "0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04)",
              "elevated": "0 20px 30px -10px rgba(11, 36, 72, 0.12)",
            },
            fontFamily: {
              "sans": ["Plus Jakarta Sans", "Inter", "sans-serif"],
              "heading": ["Plus Jakarta Sans", "sans-serif"],
              "greeting-serif": ["Plus Jakarta Sans", "sans-serif"],
              "serif-display": ["Plus Jakarta Sans", "sans-serif"],
              "serif": ["Plus Jakarta Sans", "sans-serif"],
              "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background text-text-main antialiased selection:bg-primary-light selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
